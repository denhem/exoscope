services:

  db:
    image: postgres:17
    container_name: nasa-postgres
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_DB: nasa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data: